name: release

# Pushing a tag like v0.3.0 builds the package and publishes a GitHub release whose notes are
# that version's section of CHANGELOG.md. The job fails, publishing nothing, if the tag does not
# match the version in pyproject.toml and src/modelbench/__init__.py, if the changelog has no
# dated section for it, or if the tests fail.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" build -c requirements-dev.txt
      - name: Notes from the changelog
        run: python scripts/release_notes.py "$GITHUB_REF_NAME" > release-notes.md
      - run: ruff check . && ruff format --check . && mypy src
      - run: pytest -q
      - run: python -m build
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "ModelBench ${GITHUB_REF_NAME#v}"
          --notes-file release-notes.md
          --verify-tag

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]" -c requirements-dev.txt
      - name: Lint and type-check (once)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          ruff check .
          ruff format --check .
          mypy src
      - run: pytest -q

  browser:
    # The dashboard script is tested in a real browser here, so these tests cannot be skipped.
    runs-on: ubuntu-latest
    env:
      MODELBENCH_REQUIRE_BROWSER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,browser]" -c requirements-dev.txt
      - run: playwright install --with-deps chromium
      - run: node --test tests/js/dashboard.test.js
      - run: pytest -q tests/test_dashboard_browser.py tests/test_dashboard_js.py

  commits:
    # Messages must follow Conventional Commits. Only commits new in this push or pull request
    # are checked, so older history is not rewritten.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check commit messages
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/${BASE_REF}..HEAD"
          elif git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..${SHA}"
          else
            range="${SHA}^!"  # a new branch or a force push: check the tip only
          fi
          echo "checking ${range}"
          python scripts/check_commits.py "${range}"

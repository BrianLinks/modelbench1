[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelbench"
version = "0.7.0"
description = "Local experiment tracking and model comparison without an online ML platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]
browser = ["playwright>=1.45"]  # optional: runs the dashboard tests in a real browser

[project.scripts]
modelbench = "modelbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modelbench = ["static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
